[platformio]
default_envs = octopus_pro_v11_h723
boards_dir = boards

[env:octopus_pro_v11_h723]
platform = ststm32@15.4.1
platform_packages = framework-arduinoststm32@~4.20200.220530
board = marlin_STM32H723ZE
framework = arduino
board_build.variant = MARLIN_H723ZE
board_build.variants_dir = variants
board_build.offset = 0x20000
board_upload.offset_address = 0x08020000
board_build.ldscript = variants/MARLIN_H723ZE/ldscript.ld
; STM32duino's PlatformIO builder otherwise forces LD_FLASH_OFFSET=0 for
; native-DFU boards.  This board retains BTT's 128 KiB bootloader, so both
; the linker origin and runtime vector-table offset must explicitly match it.
build_unflags =
  -Wl,--defsym=LD_FLASH_OFFSET=0x0
build_flags =
  -Wl,--defsym=LD_FLASH_OFFSET=0x20000
  -DVECT_TAB_OFFSET=0x20000
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740
  -DUSB_MANUFACTURER=\"ROBARM\"
  -DUSB_PRODUCT=\"ROBARM_Octopus_H723\"
  -DUSE_USB_HS
  -DUSE_USB_HS_IN_FS
  -DD_CACHE_DISABLED
  -DSERIAL_RX_BUFFER_SIZE=1024
  -DSERIAL_TX_BUFFER_SIZE=1024
  -DTIMER_SERVO=TIM5
  -DTIMER_TONE=TIM2
lib_deps =
  teemuatlut/TMCStepper@^0.7.3
  waspinator/AccelStepper@^1.64
monitor_speed = 3000000
upload_protocol = dfu
